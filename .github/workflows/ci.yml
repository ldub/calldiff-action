name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: 'false'

      - name: Install development dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Create a two-commit fixture repository
        run: node scripts/create-integration-fixture.mjs "${{ runner.temp }}/calldiff-fixture"

      - name: Exercise the local action on a changed call tree
        id: calldiff
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/calldiff-fixture
          base-ref: HEAD~1
          head-ref: HEAD
          comment: 'false'

      - name: Verify the changed-tree result
        env:
          CALLDIFF_HAS_CHANGES: ${{ steps.calldiff.outputs.has-changes }}
          CALLDIFF_RESULT_FILE: ${{ steps.calldiff.outputs.result-file }}
        run: node scripts/assert-integration-result.mjs "$CALLDIFF_HAS_CHANGES" "$CALLDIFF_RESULT_FILE"
