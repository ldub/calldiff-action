name: Calldiff

on:
  pull_request:
    branches: [lev/calldiff-showcase-base]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: calldiff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  calldiff:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Comment with the call-flow diff
        uses: ldub/calldiff-action@v1
        with:
          base-ref: HEAD^1
          head-ref: HEAD^2
          paths: showcase/src
          entrypoints: checkout
          max-depth: 3
          comment-header: '## calldiff · checkout flow'
