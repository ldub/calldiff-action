version: 2
updates:
  - package-ecosystem: npm
    directory: /runtime
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - calldiff
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - calldiff

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
