name: Calldiff PR Comment
description: Run calldiff between pull request commits and keep the result in one PR comment.
author: Lev Dubinets

branding:
  icon: git-pull-request
  color: purple

inputs:
  token:
    description: GitHub token used to create or update the pull request comment.
    required: false
    default: ${{ github.token }}
  calldiff-version:
    description: calldiff npm version or dist-tag. Unlocked versions require comment=false.
    required: false
    default: tested
  base-ref:
    description: Before ref. Defaults to the pull request base SHA.
    required: false
    default: ''
  head-ref:
    description: After ref. Defaults to the pull request head SHA.
    required: false
    default: ''
  pr-number:
    description: Pull request number to comment on. Defaults to the event pull request number.
    required: false
    default: ''
  post-comment-file:
    description: Advanced. Skip analysis and post a previously generated calldiff comment file, normally from an isolated job.
    required: false
    default: ''
  working-directory:
    description: Checked-out repository path, relative to GITHUB_WORKSPACE.
    required: false
    default: '.'
  paths:
    description: Optional path prefixes, one per line. Calldiff analyzes the entire repository when omitted.
    required: false
    default: ''
  entrypoints:
    description: Optional function or method entrypoints, one per line. Calldiff infers them when omitted.
    required: false
    default: ''
  max-depth:
    description: Maximum call-tree depth.
    required: false
    default: '12'
  extra-args-json:
    description: JSON array of additional calldiff arguments for newly released CLI options.
    required: false
    default: '[]'
  comment:
    description: Create or update a pull request comment. Results always go to the job summary.
    required: false
    default: 'true'
  update-comment:
    description: Update the existing calldiff comment instead of creating a new comment on every run.
    required: false
    default: 'true'
  comment-header:
    description: Markdown heading shown at the top of the pull request comment.
    required: false
    default: '## calldiff'
  max-comment-length:
    description: Maximum UTF-8 bytes before the displayed result is truncated.
    required: false
    default: '60000'
  fail-on-error:
    description: Fail the action when calldiff cannot complete. Call-flow differences never fail the action.
    required: false
    default: 'true'
  fail-on-warnings:
    description: Fail the action when calldiff reports parse or grammar warnings.
    required: false
    default: 'false'
  fail-on-comment-error:
    description: Fail when an unexpected GitHub API or comment-file error prevents commenting. Read-only fork PRs are still tolerated.
    required: false
    default: 'true'
  timeout-seconds:
    description: Per-command timeout for installing and running calldiff.
    required: false
    default: '300'

outputs:
  calldiff-version:
    description: Exact calldiff version that ran.
    value: ${{ steps.run.outputs.calldiff-version }}
  exit-code:
    description: calldiff process exit code.
    value: ${{ steps.run.outputs.exit-code }}
  has-changes:
    description: Whether calldiff reported call-flow changes (true, false, or unknown).
    value: ${{ steps.run.outputs.has-changes }}
  has-warnings:
    description: Whether calldiff emitted parse or grammar warnings.
    value: ${{ steps.run.outputs.has-warnings }}
  result-file:
    description: Runner-local file containing the complete calldiff result and warnings.
    value: ${{ steps.run.outputs.result-file }}
  comment-file:
    description: Runner-local Markdown file used for the pull request comment.
    value: ${{ steps.run.outputs.comment-file || inputs.post-comment-file }}
  comment-id:
    description: Created or updated GitHub comment ID, when commenting succeeded.
    value: ${{ steps.comment.outputs.comment-id }}
  comment-url:
    description: Created or updated GitHub comment URL, when commenting succeeded.
    value: ${{ steps.comment.outputs.comment-url }}
  commented:
    description: Whether a pull request comment was created or updated.
    value: ${{ steps.comment.outputs.commented || 'false' }}
  truncated:
    description: Whether the result was truncated in the comment and job summary.
    value: ${{ steps.run.outputs.truncated }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        package-manager-cache: 'false'

    - name: Run calldiff
      id: run
      if: ${{ inputs.post-comment-file == '' }}
      shell: bash
      env:
        CALLDIFF_INPUT_VERSION: ${{ inputs.calldiff-version }}
        CALLDIFF_INPUT_BASE_REF: ${{ inputs.base-ref }}
        CALLDIFF_INPUT_HEAD_REF: ${{ inputs.head-ref }}
        CALLDIFF_INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        CALLDIFF_INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CALLDIFF_INPUT_PATHS: ${{ inputs.paths }}
        CALLDIFF_INPUT_ENTRYPOINTS: ${{ inputs.entrypoints }}
        CALLDIFF_INPUT_MAX_DEPTH: ${{ inputs.max-depth }}
        CALLDIFF_INPUT_EXTRA_ARGS_JSON: ${{ inputs.extra-args-json }}
        CALLDIFF_INPUT_COMMENT: ${{ inputs.comment }}
        CALLDIFF_INPUT_COMMENT_HEADER: ${{ inputs.comment-header }}
        CALLDIFF_INPUT_MAX_COMMENT_LENGTH: ${{ inputs.max-comment-length }}
        CALLDIFF_INPUT_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        CALLDIFF_INPUT_FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
        CALLDIFF_INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: node "$GITHUB_ACTION_PATH/src/main.mjs"

    # Direct one-job commenting accepts only the reviewed core lock. On-demand
    # grammars remain in that job's trust boundary; the reusable workflow uses
    # a fresh runner when stronger isolation is required.
    - name: Update the pull request comment
      id: comment
      if: ${{ always() && ((inputs.post-comment-file != '' && inputs.comment != 'false') || (steps.run.outputs.comment-enabled == 'true' && steps.run.outputs.comment-file != '')) }}
      shell: bash
      env:
        CALLDIFF_COMMENT_ENABLED: ${{ inputs.comment }}
        CALLDIFF_COMMENT_UPDATE: ${{ inputs.update-comment }}
        CALLDIFF_COMMENT_FAIL_ON_ERROR: ${{ inputs.fail-on-comment-error }}
        CALLDIFF_COMMENT_TOKEN: ${{ inputs.token }}
        CALLDIFF_COMMENT_FILE: ${{ inputs.post-comment-file || steps.run.outputs.comment-file }}
        CALLDIFF_COMMENT_PR_NUMBER: ${{ inputs.pr-number || steps.run.outputs.pr-number }}
      run: node "$GITHUB_ACTION_PATH/src/comment.mjs"
